<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel — Loja Simples</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <header class="topo">
      <a class="marca" href="index.html"><img src="./assets/piurancing.png" alt=""></a>
      <div class="topo-usuario">
        <span id="email-usuario" class="texto-suave"></span>
        <button type="button" id="botao-sair" class="botao botao-contorno">Sair</button>
      </div>
    </header>

    <!-- O painel começa escondido e só aparece depois de confirmar o login -->
    <main id="painel" class="painel" hidden>
      <!-- Menu lateral: cada opção mostra uma das telas abaixo -->
      <nav class="menu-lateral">
        <button type="button" id="menu-listar" class="menu-opcao ativo">Listar produtos</button>
        <button type="button" id="menu-cadastrar" class="menu-opcao">Cadastrar produto</button>
      </nav>

      <div class="painel-conteudo">
        <!-- Mensagens de sucesso e de erro aparecem aqui -->
        <p id="mensagem" class="mensagem" hidden></p>

        <!-- TELA 1: lista dos produtos -->
        <section id="tela-lista">
          <h2>Produtos cadastrados</h2>
          <p id="aviso" class="aviso">Carregando...</p>
          <!-- As linhas são colocadas aqui pelo JavaScript (js/admin.js) -->
          <ul id="lista-produtos" class="lista-admin"></ul>
        </section>

        <!-- TELA 2: formulário (serve para cadastrar e também para editar) -->
        <section id="tela-formulario" hidden>
          <form id="form-produto" class="cartao formulario">
            <h2 id="titulo-form">Novo produto</h2>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required maxlength="80" />

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3" required maxlength="300"></textarea>

            <div class="duas-colunas">
              <div>
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" min="0" step="0.01" required />
              </div>
              <div>
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade" min="0" step="1" required />
              </div>
            </div>

            <label for="fotoUrl">Link da foto</label>
            <input type="url" id="fotoUrl" name="fotoUrl" placeholder="https://..." required />
            <p class="dica">Cole o endereço de uma imagem da internet.</p>

            <div class="acoes">
              <button type="submit" id="botao-salvar" class="botao">Cadastrar produto</button>
              <button type="button" id="botao-cancelar" class="botao botao-contorno">Cancelar</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <!-- Modelo de uma linha da lista. O JavaScript copia este modelo para cada produto. -->
    <template id="modelo-item">
      <li class="item-admin">
        <img class="item-foto" alt="" />
        <div class="item-admin-info">
          <strong class="item-nome"></strong>
          <span class="item-detalhes"></span>
        </div>
        <div class="item-admin-acoes">
          <button type="button" class="botao botao-contorno botao-pequeno botao-editar">Editar</button>
          <button type="button" class="botao botao-perigo botao-pequeno botao-excluir">Excluir</button>
        </div>
      </li>
    </template>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
